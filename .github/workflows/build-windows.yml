name: Build — Windows Installer

on:
  push:
    branches: ["main", "production/**", "release/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build PyInstaller + Inno Setup
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Read version from src/version.py
        id: version
        run: |
          $ver = python -c "from src.version import __version__; print(__version__)"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      - name: Install production + build dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify no dependency conflicts
        run: pip check

      - name: Syntax check (compileall)
        run: python -m compileall -q main.py config.py src tests scripts

      - name: Run tests (must pass before build)
        run: python -m pytest tests/ -v --tb=short -m "not hardware"

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean packaging/windows/SmartGesture.spec

      - name: Verify executable exists
        run: |
          if (!(Test-Path "dist\SmartGestureOS\SmartGestureOS.exe")) {
            Write-Error "EXE not found after PyInstaller build!"
            exit 1
          }
          Write-Host "EXE size: $((Get-Item 'dist\SmartGestureOS\SmartGestureOS.exe').Length) bytes"

      - name: Check frozen inference and UI without a camera
        run: |
          $exe = (Resolve-Path 'dist\SmartGestureOS\SmartGestureOS.exe').Path
          foreach ($check in @('--self-check', '--ui-self-check')) {
            $probe = Start-Process -FilePath $exe -ArgumentList $check -PassThru -WindowStyle Hidden
            if (-not $probe.WaitForExit(60000)) {
              Stop-Process -Id $probe.Id -Force
              throw "Frozen $check timed out."
            }
            if ($probe.ExitCode -ne 0) {
              throw "Frozen $check failed with exit code $($probe.ExitCode)."
            }
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup) with dynamic version
        run: .\scripts\build_installer.ps1 -PythonExe (Get-Command python).Source

      - name: Verify installer exists and is non-empty
        id: installer
        run: |
          $installer = Get-Item "dist\release\SmartGestureOS-Setup-v${{ steps.version.outputs.version }}.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "Installer not found in dist\release\!"
            exit 1
          }
          if ($installer.Length -eq 0) {
            Write-Error "Installer is empty (0 bytes)!"
            exit 1
          }
          Write-Host "Installer: $($installer.Name) ($($installer.Length) bytes)"
          echo "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Compute SHA-256
        run: |
          $hash = (Get-FileHash "${{ steps.installer.outputs.path }}" -Algorithm SHA256).Hash
          Write-Host "SHA-256: $hash"
          echo "$hash  ${{ steps.installer.outputs.name }}" > dist\release\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartGestureOS-Windows-build-${{ github.sha }}
          path: |
            dist/release/SmartGestureOS-Setup-v*.exe
            dist/release/SHA256SUMS.txt
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.sha }}
          path: |
            ~/AppData/Local/SmartGestureOS/logs/
            ~/AppData/Local/SmartGesture/logs/
            build/**/warn-*.txt
          if-no-files-found: ignore
          retention-days: 14
